<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prototipo navegable de Sistema TKD para revisar estructura, navegación y adaptación responsiva."
    />
    <title>Sistema TKD · Prototipo</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a1a'/%3E%3Cpath d='M16 19h32v8H36v23h-8V27H16z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">TKD</div>
          <div>
            <strong>Sistema TKD</strong>
            <span>Gestión escolar</span>
          </div>
          <button class="icon-button sidebar-close" id="close-menu" aria-label="Cerrar menú">×</button>
        </div>

        <nav id="primary-nav"></nav>

      </aside>

      <div class="scrim" id="scrim" hidden></div>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-inner">
            <button
              class="icon-button menu-button"
              id="open-menu"
              aria-label="Abrir menú"
              aria-controls="sidebar"
              aria-expanded="false"
            >
              <span aria-hidden="true">☰</span>
            </button>
            <div class="topbar-title">
              <span class="eyebrow">Sistema TKD</span>
              <strong>Academia Ji Do Kwan</strong>
            </div>
            <div class="topbar-meta" aria-label="Estado del prototipo">
              <span class="prototype-chip">Prototipo</span>
              <span class="topbar-date">Datos ficticios · 3 oct 2026</span>
            </div>
          </div>
        </header>

        <main id="contenido-principal" tabindex="-1"></main>
      </div>
    </div>

    <div class="sr-only" id="live-region" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
