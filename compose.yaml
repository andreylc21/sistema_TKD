services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tkd
      POSTGRES_USER: tkd
      POSTGRES_PASSWORD: tkd_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tkd -d tkd"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tkd_postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://tkd:tkd_demo@db:5432/tkd?sslmode=disable
      MIGRATIONS_DIR: /app/backend/migrations
      SEED_FILE: /app/backend/seed/001_demo.sql
      FRONTEND_DIR: /app/frontend/dist
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  tkd_postgres_data:
